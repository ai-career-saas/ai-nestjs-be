stages:
  - install
  - quality
  - build
  - deploy

default:
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

install:
  stage: install
  script:
    - npm ci --prefer-offline
  artifacts:
    paths: [node_modules/]
    expire_in: 1h

lint:
  stage: quality
  needs: [install]
  allow_failure: true # ปิด flag นี้เมื่อมี eslint config จริง
  script:
    - npx eslint "src/**/*.ts" || echo "ESLint ยังไม่ถูกตั้งค่าในโปรเจกต์ — ข้ามไปก่อน"

typecheck:
  stage: quality
  needs: [install]
  script:
    - npx tsc --noEmit

test:
  stage: quality
  needs: [install]
  allow_failure: true # ปิด flag นี้เมื่อมี Jest suite จริง
  script:
    - npx jest --ci --coverage || echo "Jest ยังไม่ถูกตั้งค่าในโปรเจกต์ — ข้ามไปก่อน"
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

build:
  stage: build
  needs: [install]
  script:
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1h

deploy-render:
  stage: deploy
  image: alpine:3.20
  needs: [build]
  environment:
    name: production
  script:
    - apk add --no-cache curl jq
    - |
      DEPLOY_ID=$(curl -fsS -X POST \
        "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
        -H "Authorization: Bearer $RENDER_API_KEY" \
        -H "Content-Type: application/json" | jq -r '.id')

      echo "Triggered deploy: $DEPLOY_ID"

      for i in $(seq 1 30); do
        STATUS=$(curl -fsS \
          "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
          -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
        echo "status: $STATUS"

        case "$STATUS" in
          live) exit 0 ;;
          build_failed|update_failed|canceled|deactivated)
            echo "Render deploy failed with status: $STATUS"; exit 1 ;;
        esac
        sleep 15
      done

      echo "Timed out waiting for deploy to go live"; exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
