name: Mirror to GitLab

on:
  push:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror repository to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_REPOSITORY: https://gitlab.com/SataponNAM/ai-career-saas/ai-nestjs-be.git
        run: |
          git clone --mirror "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git

          cd repo.git

          git push --mirror "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPOSITORY#https://}"
